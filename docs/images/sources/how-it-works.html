<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:G;src:url(Geist-SemiBold.woff2);font-weight:600}
@font-face{font-family:G;src:url(Geist-Regular.woff2);font-weight:400}
@font-face{font-family:M;src:url(GeistMono-Regular.woff2)}
*{box-sizing:border-box;margin:0}
body{width:1280px;height:360px;background:#0b0b10;color:#ecebf5;font-family:G,sans-serif;display:flex;align-items:center;justify-content:center;gap:0;padding:0 56px}
.card{width:340px;height:260px;background:#131218;border-radius:24px;padding:28px;display:flex;flex-direction:column}
.n{width:40px;height:40px;border-radius:50%;background:#fbc711;color:#111827;font-weight:600;font-size:22px;display:flex;align-items:center;justify-content:center}
h2{font-size:28px;font-weight:600;margin:20px 0 10px}
p{font-size:20px;color:#b4b3bd;line-height:1.4}
code{font-family:M;font-size:18px;color:#fbc711}
.arrow{width:70px;text-align:center;font-size:40px;color:#fbc711}
</style></head><body>
<div class="card"><div class="n">1</div><h2>Save it once</h2><p>Put a command you keep retyping in the sidebar, for example <code>df -h</code>.</p></div>
<div class="arrow">&rarr;</div>
<div class="card"><div class="n">2</div><h2>Click it</h2><p>It runs in the active tab at once. Ctrl and click types it without pressing Enter.</p></div>
<div class="arrow">&rarr;</div>
<div class="card"><div class="n">3</div><h2>Done</h2><p>Your own shell does the work, on your own computer.</p></div>
</body></html>
